<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Rishav!</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff4e0; --ink:#2b1a4a; --pink:#ff4f8b; --sun:#ffb62e; --teal:#14b8a6; --card:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1d1233; --ink:#fff1de; --card:#2b1d4a;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center;
  text-align:center; padding:24px; overflow-x:hidden;
}
main{max-width:560px; width:100%; position:relative; z-index:2}
.cake{font-size:84px; line-height:1; display:inline-block; cursor:pointer; user-select:none;
  transition:transform .2s}
.cake:active{transform:scale(.9) rotate(-6deg)}
h1{font-size:clamp(40px,10vw,76px); line-height:1.02; margin:12px 0 8px; font-weight:800; letter-spacing:-1px}
h1 span{color:var(--pink)}
p{font-size:clamp(17px,4.4vw,21px); line-height:1.5; margin:0 auto 22px; max-width:46ch}
button{
  font:inherit; font-weight:700; font-size:18px; color:#fff; background:var(--pink);
  border:0; border-radius:999px; padding:14px 30px; cursor:pointer;
  box-shadow:0 6px 0 #c42e63; transition:transform .1s, box-shadow .1s;
}
button:active{transform:translateY(4px); box-shadow:0 2px 0 #c42e63}
button:focus-visible,.cake:focus-visible{outline:3px solid var(--teal); outline-offset:4px}
#wish{
  min-height:3.2em; margin-top:26px; font-size:20px; font-weight:600;
  background:var(--card); border-radius:18px; padding:16px 18px;
  border:2px dashed var(--sun);
}
.bit{position:fixed; top:-20px; width:10px; height:16px; z-index:1; pointer-events:none;
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:.9}}
@media (prefers-reduced-motion: reduce){.bit{display:none}}
</style>
</head>
<body>
<main>
  <div class="cake" id="cake" tabindex="0" role="button" aria-label="Celebrate">🎂</div>
  <h1>Happy Birthday,<br><span>Rishav!</span></h1>
  <p>Wishing you a day full of laughter, good food, great company and everything you’ve been hoping for.</p>
  <button id="btn">Tap for a wish</button>
  <div id="wish" aria-live="polite">Your wish is waiting. 🎁</div>
</main>
<script>
const wishes=[
  "May this year bring you big wins and bigger smiles. 🎉",
  "Here’s to good health, good friends and good times ahead. 🥳",
  "Another year older, another year better. Enjoy every bit! 🎈",
  "Hope your day is as awesome as you are, Rishav! ✨",
  "May all your dreams take off this year. 🚀",
  "Eat the cake, make a wish, and have the best day ever! 🍰"
];
const colors=["#ff4f8b","#ffb62e","#14b8a6","#7c5cff","#ff7a3d"];
let i=-1;
function confetti(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let k=0;k<n;k++){
    const b=document.createElement("div");
    b.className="bit";
    b.style.left=Math.random()*100+"vw";
    b.style.background=colors[k%colors.length];
    b.style.animationDuration=(2.2+Math.random()*2.2)+"s";
    b.style.animationDelay=(Math.random()*.6)+"s";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),5500);
  }
}
function celebrate(){
  i=(i+1)%wishes.length;
  document.getElementById("wish").textContent=wishes[i];
  confetti(70);
}
document.getElementById("btn").addEventListener("click",celebrate);
const cake=document.getElementById("cake");
cake.addEventListener("click",celebrate);
cake.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();celebrate();}});
window.addEventListener("load",()=>confetti(60));
</script>
</body>
</html>
